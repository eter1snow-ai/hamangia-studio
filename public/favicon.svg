<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#000000"/>
  
  <circle cx="50" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  
  <!-- Left point (Gray) -->
  <polygon points="12,50 50,38 50,62" fill="#9ca3af"/>
  
  <!-- Right point (Gray) -->
  <polygon points="88,50 50,38 50,62" fill="#9ca3af"/>
  
  <!-- Top point (White) -->
  <polygon points="50,12 38,50 62,50" fill="#ffffff"/>
  
  <!-- Bottom point (White) -->
  <polygon points="50,88 38,50 62,50" fill="#ffffff"/>

  <!-- Center highlight to make it look sharp -->
  <polygon points="50,38 62,50 50,62 38,50" fill="#e5e7eb"/>
</svg>
